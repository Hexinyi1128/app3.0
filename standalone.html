<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>跳岛 · ISLAND HOP（可直接运行版）</title>
<style>
:root{
  --primary:#E79A6C;--deep:#C97B52;--mist:#F4DCC8;--mistlight:#FDF0E6;
  --page:#FCF8F3;--ink:#3A302B;--muted:#A69A90;--line:#EFE5DC;
  --okay:#A9D6BE;--off:#E8A9A0;
  --sun:#F4A259;--peach:#F7C9A9;--lav:#C9B6E6;--mint:#A9D6BE;--cream:#FFF6EA;
  --sea:#A9DBE8;--sea-deep:#6FB9D2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:#F3EDE6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
button{color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer}
::selection{background:rgba(110,150,194,.28);color:inherit}
#app{position:relative;width:100%;max-width:375px;min-height:100vh;min-height:100dvh;margin:0 auto;overflow:hidden;background:var(--page)}
@media(min-width:640px){#app{margin:20px auto;min-height:calc(100dvh - 40px);border-radius:30px;box-shadow:0 24px 60px rgba(42,45,51,.16)}}
.screen{min-height:100%;padding-bottom:100px}
.overlap{position:relative;z-index:6;margin-left:12px;margin-right:12px}

#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:8px;background:#F3EDE6}
#splash .splash-frame{position:relative;width:100%;height:100%;overflow:hidden;border-radius:28px;background:linear-gradient(150deg,#F7B77E,#E79A6C 55%,#C9B6E6);box-shadow:0 24px 60px rgba(90,60,40,.2);transition:opacity .35s ease,transform .35s ease}
#splash.out .splash-frame{opacity:0;transform:scale(1.04);pointer-events:none}
#splash svg{width:100%;height:100%;display:block}
#splash .stitle{position:absolute;top:18%;left:0;right:0;text-align:center;color:#fff;opacity:0;animation:fadeUp .7s .25s ease-out forwards}
#splash .stitle b{display:block;font-size:30px;letter-spacing:.22em;font-weight:700}
#splash .stitle span{display:block;margin-top:8px;font-size:11px;letter-spacing:.14em;opacity:.85}
#splash .sfoot{position:absolute;bottom:9%;left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font-size:11px;letter-spacing:.08em;opacity:0;animation:fadeUp .6s .7s ease-out forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pad{padding-left:20px;padding-right:20px}
.hide-scroll{scrollbar-width:none;-ms-overflow-style:none}
.hide-scroll::-webkit-scrollbar{display:none}

.hdr{position:relative;overflow:hidden;margin:12px 12px 0;border:1px solid rgba(255,255,255,.6);border-radius:24px;background:linear-gradient(150deg,#F7C9A9,#FDF0E6);padding:28px 18px 30px}
.hdr.tight{padding-top:22px}
.glass{background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.58);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.glass-strong{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hdr .deco{position:absolute;inset:0;pointer-events:none}
.hdr .deco i{position:absolute;display:block;border-radius:999px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.58)}
.hdr .content{position:relative;z-index:2}

.hdr.home-header{margin:12px 12px 0;padding:24px 18px 30px;border:1px solid rgba(255,255,255,.7);border-radius:24px;background:linear-gradient(150deg,#FFD9AE 0%,#FFE9D2 48%,#E4F0F7 100%);transition:transform .3s ease,opacity .3s ease}
.hdr.home-header.collapsed{transform:translateY(calc(-100% - 16px));opacity:0;pointer-events:none}
.home-overlap{margin-left:12px;margin-right:12px}
.island-map{position:relative;margin:0;min-height:960px;padding:0;background:#fff;overflow:hidden}
.island-lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.island-title{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 0}
.island-title h1{margin:0;font-size:20px;letter-spacing:-.4px;color:var(--ink)}
.island-title .count{font-size:11px;font-weight:700;color:var(--muted)}
.island-search{position:relative;z-index:3;display:grid;place-items:center;width:36px;height:36px;flex:none;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--deep);box-shadow:0 4px 12px rgba(90,60,40,.08)}
.island-search svg{width:18px;height:18px}
.island-node{position:absolute;z-index:2;width:27%;display:flex;flex-direction:column;align-items:center;padding:0;border:0;background:none;transform:translate(-50%,-50%)}
.island-orb{position:relative;width:100%;aspect-ratio:3/4;background-size:cover;background-position:center top;border-radius:18px;transition:transform .2s ease,filter .3s ease;-webkit-mask-image:radial-gradient(ellipse 72% 64% at 50% 50%,#000 54%,transparent 100%);mask-image:radial-gradient(ellipse 72% 64% at 50% 50%,#000 54%,transparent 100%)}
.island-node:active .island-orb{transform:scale(.95)}
.island-node.locked .island-orb{filter:grayscale(1) contrast(.96)}
.island-node.lit .island-orb{filter:drop-shadow(0 8px 14px rgba(120,90,60,.18))}
.island-name{margin-top:-2px;font-size:11px;font-weight:700;color:var(--ink);text-align:center;white-space:nowrap}
.island-node.locked .island-name{color:#9A9A9A}
.island-note{position:absolute;left:0;right:0;bottom:96px;z-index:3;text-align:center;font-size:10px;color:var(--muted)}
.island-note b{color:var(--deep)}
.hdr-eyebrow{margin:0;font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--deep)}
.hdr-greeting{margin:10px 0 0;font-size:12px;line-height:1.5;color:var(--deep)}
.hdr-title{margin:16px 0 0;font-size:28px;line-height:1.25;letter-spacing:-.6px;color:var(--ink)}
.hdr-desc{margin:8px 0 0;font-size:12px;line-height:1.6;color:var(--deep)}
.home-header .hdr-eyebrow{color:#9A6134}
.home-header .hdr-greeting{color:#8A5A30}
.home-header .hdr-title{color:#3A2A20}
.home-header .hdr-desc{color:#8A5A30}
.hdr-search{display:flex;align-items:center;gap:10px;width:100%;height:42px;margin-top:18px;padding:0 14px;border:1px solid rgba(255,255,255,.9);border-radius:999px;background:rgba(255,255,255,.72);color:var(--deep);font-size:12px;text-align:left}
.hdr-search .hint{flex:1;color:rgba(85,128,176,.82)}
.hdr-search .go{font-size:16px;font-weight:600}
.srch-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 12px 56px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.srch-back{display:grid;place-items:center;width:38px;height:38px;flex:none;border:0;border-radius:50%;background:var(--page);color:var(--ink)}
.srch-box{display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:42px;padding:0 12px;border:1px solid var(--mist);border-radius:999px;background:#fff;color:var(--deep)}
.srch-box input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:12px;color:var(--ink)}
.srch-box input::placeholder{color:var(--muted)}
.srch-clear{display:grid;place-items:center;width:22px;height:22px;flex:none;border:0;border-radius:50%;background:var(--mistlight);color:var(--deep);font-size:14px;line-height:1}
.srch-label{margin:0;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.srch-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.header-mini{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;z-index:39;display:flex;align-items:center;gap:10px;width:min(calc(100% - 24px),351px);padding:8px 10px;border:1px solid rgba(255,255,255,.7);border-radius:22px;background:linear-gradient(150deg,#F7C9A9,#FDF0E6);box-shadow:0 12px 30px rgba(160,100,70,.22);opacity:0;pointer-events:none;transform:translate(-50%,-150%);transition:transform .28s ease,opacity .28s ease}
.header-mini.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.mini-round{display:grid;place-items:center;width:36px;height:36px;flex:none;border:1px solid rgba(255,255,255,.75);border-radius:50%;background:rgba(255,255,255,.55);color:var(--deep)}
.mini-main{flex:1;min-width:0;padding:0 2px;border:0;background:none;text-align:left;color:var(--ink)}
.mini-title{display:block;font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-sub{display:block;margin-top:2px;font-size:9px;line-height:1.2;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reco-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.reco-eyebrow{margin:0;font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--deep)}
.reco-title{margin:4px 0 0;font-size:17px;font-weight:700;line-height:1.3;color:var(--ink)}
.reco-more{flex:none;padding:6px 0;border:0;background:none;color:var(--muted);font-size:11px}

.card{background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(160,100,70,.09)}
.card.click{cursor:pointer;transition:transform .15s}
.card.click:active{transform:scale(.99)}
.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-5{margin-top:20px}.mt-6{margin-top:24px}.mt-7{margin-top:28px}
.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}

.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:54px;padding:0 8px 0 24px;border:0;border-radius:999px;font-size:15px;font-weight:700;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn[disabled],.btn.disabled{opacity:.4;pointer-events:none}
.btn .arrow{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:50%}
.btn.dark{background:var(--ink);color:#fff;box-shadow:0 10px 30px rgba(42,45,51,.16)}
.btn.dark .arrow{background:#fff;color:var(--ink)}
.btn.deep{background:var(--deep);color:#fff;box-shadow:0 10px 24px rgba(85,128,176,.26)}
.btn.deep .arrow{background:#fff;color:var(--deep)}
.btn.light{background:#fff;color:var(--ink);box-shadow:0 10px 30px rgba(85,128,176,.08)}
.btn.light .arrow{background:var(--ink);color:#fff}
.btn.compact{height:36px;padding-left:14px;font-size:11px}
.btn.compact .arrow{width:28px;height:28px}
.btn.compact .arrow svg{width:12px;height:12px}

.pill{display:inline-flex;align-items:center;gap:5px;flex:none;padding:6px 11px;border-radius:999px;font-size:11px;font-weight:600;line-height:1;border:0;white-space:nowrap}
.pill.default{background:var(--mistlight);color:var(--deep)}
.pill.mist{background:rgba(198,216,234,.7);color:var(--deep)}
.pill.dark{background:var(--ink);color:#fff}
.pill.green{background:rgba(168,208,141,.25);color:#4F7B45}
.pill.red{background:rgba(217,136,128,.2);color:#B05D56}
.pill.outline{background:#fff;border:1px solid var(--line);color:var(--muted)}
.pill.glasspill{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);color:var(--deep)}

.ring{position:relative;display:grid;place-items:center;flex:none;border-radius:50%;border:1px solid rgba(110,150,194,.35);background:rgba(255,255,255,.6);color:var(--deep)}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid currentColor;opacity:.22}
.ring span{font-weight:700;letter-spacing:.08em;line-height:1}
.mentor-avatar{display:block;flex:none;object-fit:cover;border-radius:50%;border:1px solid rgba(110,150,194,.35);background:#EAF1F8}
.portrait-stage{position:relative;border-radius:18px;overflow:hidden;background:#DCEAF7}
.portrait-stage img{display:block;width:100%;height:auto}
.look-strip{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.look-strip::-webkit-scrollbar{display:none}
.look-tile{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:62px;padding:10px 7px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);transition:transform .15s,border-color .15s,background .15s}
.look-tile:active{transform:scale(.96)}
.look-tile.on{border-color:var(--primary);background:var(--mistlight)}
.look-ico{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--mistlight);color:var(--deep)}
.look-ico svg{width:28px;height:28px;overflow:visible}
.look-name{font-size:9px;font-weight:700;white-space:nowrap}

.interest-tile{height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);transition:background .18s,border-color .18s,transform .18s}
.interest-tile:active{transform:scale(.97)}
.interest-tile.on{background:var(--mistlight);border-color:var(--mist);color:var(--deep)}
.interest-icon{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:50%;border:1px solid rgba(110,150,194,.22);background:linear-gradient(145deg,#fff,#EAF1F8);color:var(--deep);box-shadow:0 5px 12px rgba(85,128,176,.1),inset 0 0 0 3px rgba(255,255,255,.8)}
.interest-icon svg{width:18px;height:18px}
.interest-tile.on .interest-icon{background:var(--deep);border-color:var(--deep);color:#fff;box-shadow:0 6px 14px rgba(85,128,176,.3)}
.interest-label{font-size:11px;font-weight:600;line-height:1}

.login-hero{position:relative;overflow:hidden;margin:0 12px;padding:30px 20px 42px;border-radius:26px;background:linear-gradient(150deg,#F7B77E,#F7C9A9)}
.login-hero::after{content:"";position:absolute;right:-48px;top:-56px;width:184px;height:184px;border-radius:50%;background:rgba(255,255,255,.26)}
.login-hero::before{content:"";position:absolute;left:-34px;bottom:-62px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.2)}
.login-card{position:relative;z-index:2;margin:-24px 12px 0;padding:24px 20px;border-radius:24px;background:#fff;box-shadow:0 16px 40px rgba(85,128,176,.13)}
.login-field{display:flex;align-items:center;gap:10px;height:48px;margin-top:12px;padding:0 14px;border:1px solid var(--line);border-radius:16px;background:var(--page)}
.login-field svg{width:17px;height:17px;flex:none;color:var(--deep)}
.login-field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px;color:var(--ink)}
.login-field input::placeholder{color:var(--muted)}
.login-divider{display:flex;align-items:center;gap:10px;margin:24px 0 14px;color:var(--muted);font-size:10px;letter-spacing:.12em}
.login-divider::before,.login-divider::after{content:"";flex:1;height:1px;background:var(--line)}

.store-hero{position:relative;height:230px;margin:16px 16px 0;overflow:hidden;border-radius:24px;background-size:cover;background-repeat:no-repeat;box-shadow:0 10px 30px rgba(85,128,176,.12)}
.store-hero-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,30,45,.06),rgba(20,30,45,.6))}
.store-hero-copy{position:absolute;left:20px;right:20px;bottom:24px;color:#fff;pointer-events:none}
.store-hero-copy p{margin:0}
.store-hero-copy .eyebrow{font-size:10px;font-weight:700;letter-spacing:.22em;opacity:.85}
.store-hero-copy h1{margin:10px 0 0;font-size:26px;line-height:1.25;letter-spacing:-.6px}
.store-hero-copy .sub{margin-top:8px;font-size:11px;opacity:.88}
.hero-gallery{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hero-gallery::-webkit-scrollbar{display:none}
.hero-gallery-slide{flex:0 0 100%;height:100%;background-size:cover;background-position:center;scroll-snap-align:start}
.hero-gallery-dots{position:absolute;right:20px;bottom:26px;z-index:3;display:flex;gap:5px}
.hero-gallery-dots button{width:6px;height:6px;padding:0;border:0;border-radius:99px;background:rgba(255,255,255,.5);transition:width .2s,background .2s}
.hero-gallery-dots button.on{width:16px;background:#fff}
.store-review{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.store-review:last-of-type{border-bottom:0}
.store-avatar{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:50%;background:var(--mistlight);color:var(--deep);font-size:12px;font-weight:700}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:40;width:100%;max-width:375px;padding:0 16px 16px;pointer-events:none}
@media(min-width:640px){.nav{bottom:20px}}
.nav-inner{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:2px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.88);box-shadow:0 10px 28px rgba(42,45,51,.18);backdrop-filter:blur(14px)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:52px;height:50px;flex:none;border:0;border-radius:999px;background:#fff;color:var(--muted);font-size:12px;font-weight:600}
.tab svg{width:18px;height:18px}
.tab-label{font-size:9px;line-height:1;letter-spacing:.02em}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(231,154,108,.35)}
.plus-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;margin-top:-18px;padding:0;border:0;background:none;color:var(--primary)}
.plus{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(231,154,108,.42)}
.plus-wrap svg{width:24px;height:24px}
.plus-label{font-size:9px;line-height:1;color:var(--primary);font-weight:600}
.float-back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;z-index:46;display:grid;place-items:center;width:38px;height:38px;transform:translateX(calc(-1 * min(50vw, 187.5px) + 12px));border:1px solid rgba(255,255,255,.9);border-radius:50%;background:rgba(255,255,255,.94);color:var(--ink);box-shadow:0 8px 22px rgba(42,45,51,.18);backdrop-filter:blur(10px)}
.float-back svg{width:19px;height:19px}
.section-anchor{scroll-margin-top:76px}

.scene{position:absolute;inset:0;overflow:hidden}
.scene svg{width:100%;height:100%;display:block}
.scene-scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.2) 55%,rgba(255,255,255,.78) 100%)}
.scene-photo{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;filter:saturate(.92)}
.scene-glass{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(255,255,255,0) 32%,rgba(255,255,255,.24) 72%,rgba(255,255,255,.68) 100%)}
.scene-glass::before{content:"";position:absolute;inset:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);mask-image:radial-gradient(ellipse at 50% 46%,transparent 36%,#000 94%);-webkit-mask-image:radial-gradient(ellipse at 50% 46%,transparent 36%,#000 94%)}
.scene-card{position:relative;overflow:hidden;background:#DCE7F2}
.scene-card .ring{background:rgba(255,255,255,.82);backdrop-filter:blur(6px)}

.unlock-node{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;gap:5px;border:0;background:none;padding:0}
.unlock-node .orb{position:relative;display:grid;place-items:center;width:74px;height:42px;padding-bottom:5px;border-radius:74px 74px 0 0;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.95);color:var(--deep);box-shadow:0 8px 18px rgba(42,45,51,.14);font-size:17px;font-weight:700}
.unlock-node .orb::after{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#2A2D33}
.unlock-node.locked .orb{background:rgba(255,255,255,.4);color:rgba(85,128,176,.55);border-color:rgba(255,255,255,.5);box-shadow:none}
.unlock-node.locked .orb::after{opacity:.25}
.unlock-node small{font-size:10px;font-weight:600;color:var(--deep);text-shadow:0 1px 2px rgba(255,255,255,.9)}
.unlock-node.locked small{color:rgba(85,128,176,.6)}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;width:310px;padding:12px 14px;border-radius:18px;background:rgba(42,45,51,.95);color:#fff;box-shadow:0 12px 34px rgba(42,45,51,.2);font-size:12px;line-height:1.5;animation:toastIn .24s ease-out}
@media(min-width:640px){.toast{top:36px}}
.toast .tick{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:50%;background:var(--okay);color:var(--ink)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}

.sheet-mask{position:fixed;inset:0;z-index:50;background:rgba(42,45,51,.25);backdrop-filter:blur(2px)}

function buildReviews(){
  const out=[]
  DATA.islands.forEach((island,ii)=>{
    const img=island.id==='video'?'makeup':island.id==='retouch'?'petgroom':island.id
    for(let n=0;n<48;n++){
      const rating=REVIEW_RATINGS[(n+ii)%REVIEW_RATINGS.length]
      const name=REVIEW_NAMES[(n+ii*2)%REVIEW_NAMES.length]
      const mediaCount=n%4===0?0:(n%3===0?3:(n%2===0?2:1))
      const pool=REVIEW_MEDIA[island.id]
      const media=Array.from({length:mediaCount},(_,k)=>({src:pool?pool[(n*2+k)%pool.length]:`images/${img}.jpg`,video:mediaCount>1&&k===0&&n%5===0}))
      const month=n<16?11:n<34?10:9
      const day=(n*7+ii*3)%28+1
      const textPool=STORE_REVIEW_TEXTS[island.id]||REVIEW_TEXTS
      out.push({
        id:`rv_${island.id}_${n}`,islandId:island.id,name,avatar:name.slice(0,1),
        date:`${String(month).padStart(2,'0')}.${String(day).padStart(2,'0')}`,
        rating,text:textPool[(n+ii)%textPool.length],
        tags:[REVIEW_TAGS[(n+ii)%REVIEW_TAGS.length],REVIEW_TAGS[(n*2+ii)%REVIEW_TAGS.length]].filter((v,i,a)=>a.indexOf(v)===i),
        media,likes:(n*13+ii*7)%86+3,level:DATA.levels[n%3].name
      })
    }
  })
  return out
}

  const list=reviewsForCurrent()
  return list.length?(list.reduce((sum,r)=>sum+r.rating,0)/list.length).toFixed(1):'0.0'

function reviewCountFor(tab){
  const list=reviewsForCurrent()
  if(tab==='media')return list.filter(r=>r.media.length).length
  if(tab==='good')return list.filter(r=>r.rating>=4).length
  if(tab==='bad')return list.filter(r=>r.rating<=3).length
  if(tab==='five')return list.filter(r=>r.rating===5).length
  return list.length
}

const labelOf = id => {
  const all=[...DATA.diary.fun,...DATA.diary.hard,...Object.values(DIARY_OPTIONS).flatMap(g=>[...g.fun,...g.hard])]
  const hit=all.find(x=>(Array.isArray(x)?x[0]:x.id)===id)
  return hit?hit[1]:(DATA.diary.feelings.find(x=>x.id===id)||{}).short||id
}

function deriveOutcome(d){
  const e=d.excitement??5
  const pos=d.feelings.some(f=>f.on&&f.tone==='positive')
  const neg=d.feelings.some(f=>f.on&&f.tone==='negative')
  if(e>=7)return 'stay'
  if(e<=4)return 'leave'
  if(pos&&!neg)return 'stay'
  if(neg&&!pos)return 'leave'
  return d.fun.length>=2?'stay':'leave'
}

function recommendations(){
  const excluded=new Set(S.records.filter(r=>r.status==='excluded'&&r.id!==S.flowEntryId).map(r=>r.islandId))
  const outcome=S.preview||S.outcome
  if(outcome==='leave')excluded.add(S.selectedIslandId)
  const signals=[]
  S.diary.fun.forEach(id=>signals.push({id,kind:'like'}))
  S.diary.hard.forEach(id=>signals.push({id,kind:'avoid'}))
  S.diary.feelings.filter(f=>f.on).forEach(f=>signals.push({id:f.id,kind:f.tone==='negative'?'avoid':'like'}))
  return DATA.islands.filter(i=>!excluded.has(i.id)).map(island=>{
    let score=DATA.rules.base[island.id]||0
    const tags=[]
    signals.forEach(sig=>{
      const explicit=DATA.rules.signals[sig.id]
      const w=explicit?.[island.id]??(explicit?0:(sig.kind==='like'?1:-1))
      if(!w)return
      score+=w
      const tag=(sig.kind==='like'?'喜欢':'避开')+labelOf(sig.id)
      if(!tags.includes(tag))tags.push(tag)
    })
    return {island,score,tags:tags.slice(0,2),note:DATA.rules.notes[island.id]||''}
  }).sort((a,b)=>b.score-a.score||b.island.rating-a.island.rating).slice(0,2)
    .map(x=>({...x,tags:x.tags.length?x.tags:['和你上次的选择不同']}))
}

function nearestDistrict(lat,lng){
  return DISTRICTS.reduce((best,d)=>{
    const dist=(d.lat-lat)**2+(d.lng-lng)**2
    return !best||dist<best.dist?{...d,dist}:best
  },null)
}
function coordsForLocation(loc){
  const d=DISTRICTS.find(x=>loc.includes(x.city)&&loc.includes(x.district))||DISTRICTS.find(x=>loc.includes(x.city))||DISTRICTS[0]
  return {lat:d.lat,lng:d.lng}
}

function coarseLocation(loc){
  const parts=String(loc||'').split(' · ').filter(Boolean)
  return parts.slice(0,2).join(' · ')||'附近'
}
function storeDirection(store){
  const dx=store.x-45,dy=47-store.y
  const names=['正北','东北','正东','东南','正南','西南','正西','西北']
  return names[Math.round(((Math.atan2(dx,dy)+Math.PI*2)%(Math.PI*2))/(Math.PI/4))%8]
}
async function resolveLocation(lat,lng){
  let city='',district=''
  try{
    const r=await fetch(`https://geocode.xyz/${lat},${lng}?geoit=json`)
    const j=await r.json()
    if(!j.error){
      city=j.city||j.state||''
      district=j.district||''
    }
  }catch(e){}
  try{
    if(!city||!district){
      const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=zh`)
      const j=await r.json()
      city=city||j.city||j.principalSubdivision||''
      district=district||j.locality||''
    }
  }catch(e){}
  if(!city&&!district){
    const n=nearestDistrict(lat,lng)
    return `${n.city} · ${n.district}`
  }
  return city?[city,district].filter(Boolean).join(' · '):(district||'附近')
}
function startAutoLocation(){
  if(!navigator.geolocation)return
  const options={enableHighAccuracy:false,timeout:10000,maximumAge:300000}
  navigator.geolocation.getCurrentPosition(pos=>{
    const geo={lat:pos.coords.latitude,lng:pos.coords.longitude}
    S.geo=geo;S.mapCenter={...geo}
    const near=nearestDistrict(geo.lat,geo.lng)
    S.location=coarseLocation(`${near.city} · ${near.district}`)
    render()
    resolveLocation(geo.lat,geo.lng).then(loc=>{
      const next=coarseLocation(loc)
      if(next!==S.location){S.location=next;render()}
    }).catch(()=>{})
  },()=>{},options)

function viewHome(){
  const homeList=DATA.islands
  S.homeList=homeList.map(x=>x.id)
  const litIds=[...new Set(S.records.map(r=>r.islandId))]
  const litCount=homeList.filter(x=>litIds.includes(x.id)).length
  const spots=[
    [26,14],[70,11],[30,31],[72,33],[22,51],[68,55],[32,73],[70,78]
  ]
  const nodes=homeList.map((i,n)=>{
    const lit=litIds.includes(i.id)
    const [x,y]=spots[n]||[50,50+n*10]
    return `<button class="island-node ${lit?'lit':'locked'}" data-action="open-detail-id" data-id="${i.id}" style="left:${x}%;top:${y}%" title="${esc(i.name)}">
      <div class="island-orb" style="background-image:url('./images/islands/${i.id}.png')"></div>
      <span class="island-name">${esc(i.name)}</span>

  }).join('')
  const pts=spots.map(([x,y],n)=>`${x},${y+3}`).join(' ')
  const pending=S.bookings.filter(b=>b.status==='booked').length
  return `<div class="screen" style="padding-bottom:0">
    <div class="island-map">
      <svg class="island-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">

      <div class="card" style="padding:20px"><p style="margin:0;font-size:12px;font-weight:700">02 · 哪个环节最困难？<span style="font-weight:400;color:var(--muted)"> 可多选</span></p><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">${opts.hard.map(([id,label])=>`<button class="chip hard ${d.hard.includes(id)?'on':''}" data-action="diary-chip" data-group="hard" data-id="${id}">${label}</button>`).join('')}</div>${d.hard.includes('h_other')?`<input data-field="hardOther" maxlength="24" value="${esc(d.hardOther)}" placeholder="写出你觉得困难的环节" style="width:100%;margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--page);font-size:12px;color:var(--ink);outline:none">`:''}<p class="smallnote" style="margin-top:12px">困难不是扣分，它只是告诉你这座岛哪块石头硌脚。</p></div>

function viewSummary(){

      <div class="card" style="padding:20px"><p style="margin:0;font-size:12px;font-weight:700">最困难的环节</p><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">${(s.hard||[]).length?s.hard.map(t=>tag(t,'red')).join(''):'<span class="smallnote">这次没有特别记下</span>'}</div></div>

function avatarAnalysis(){
  const nameOf=id=>{const i=findIsland(id);return i?i.name:(AVATAR_PROPS[id]||{}).label||id}
  const tried=[...new Set(S.records.map(r=>r.islandId))].filter(id=>findIsland(id))
  const liked=[...new Set([...S.records.filter(r=>r.status==='revisit').map(r=>r.islandId),...(S.interests||[])])].filter(id=>findIsland(id))
  const ruled=[...new Set(S.records.filter(r=>r.status==='excluded').map(r=>r.islandId))].filter(id=>findIsland(id))
  const high=(S.preferences||[]).filter(p=>p.score>=70).map(p=>p.label)
  const low=(S.preferences||[]).filter(p=>p.score<=40).map(p=>p.label)
  const affinity=Object.entries(S.careerAffinity||{}).filter(([,v])=>v.count).map(([id,v])=>({id,score:Math.round(v.total/v.count/5*100)})).sort((a,b)=>b.score-a.score)
  let headline,summary
  if(liked.length&&ruled.length){
    headline='在靠近与远离之间，你已经有自己的坐标'
    summary=`你被「${liked.slice(0,3).map(nameOf).join('、')}」吸引，也清楚地放下了「${ruled.slice(0,2).map(nameOf).join('、')}」。方向不是想出来的，是一次次试出来的。`
  }else if(liked.length){
    headline='你正在靠近一类具体的工作气质'
    summary=`「${liked.slice(0,3).map(nameOf).join('、')}」里反复出现的那种感觉，正是你在寻找的东西。可以继续往这个方向多走一步。`
  }else if(ruled.length){
    headline='排除，也是一种清晰的偏好'
    summary=`你已经知道「${ruled.slice(0,2).map(nameOf).join('、')}」不太适合自己。能说清不想要什么，往往比什么都想试更接近答案。`
  }else{
    headline='你的画像才刚刚开始'
    summary='去体验一座职业岛，写下第一次感受，这里就会长出属于你的分析。'
  }
  if(high.length)summary+=` 你更在意${high.join('、')}。`
  if(low.length)summary+=` 而${low.join('、')}容易消耗你。`
  const traits=[]
  if(high.includes('与人交流'))traits.push('交流驱动')
  if(high.includes('动手创造'))traits.push('动手派')
  if(high.includes('即时反馈'))traits.push('看重看得见的成果')
  if(low.includes('重复性动作'))traits.push('抗拒机械重复')
  if(affinity.length&&affinity[0].score>=80)traits.push('对'+nameOf(affinity[0].id)+'有明显好感')
  if(tried.length>=4)traits.push('探索面广')
  if(ruled.length)traits.push('判断果断')
  if(!traits.length)traits.push('保持开放')
  return {headline,summary,traits:traits.slice(0,4),tried:tried.length,liked:liked.length,ruled:ruled.length}
}

function bookingDate(b){return `${b.year} 年 ${b.month} 月 ${b.day} 日`}
const ARRIVAL_TIMES={s_coffee:'08:45',s_photo:'08:35',s_florist:'09:00',s_design:'08:50',s_light:'08:30',s_baker:'08:40',s_video:'08:55',s_retouch:'08:35'}
function arrivalTime(storeId){return ARRIVAL_TIMES[storeId]||'08:30'}
function beijingNow(){return new Date(Date.now()+8*3600*1000)}
function bookingMoment(b){
  const st=findStore(b.storeId)||DATA.stores.find(x=>x.islandId===b.islandId)||DATA.stores[0]
  const [h,m]=arrivalTime(st.id).split(':').map(Number)
  return Date.UTC(b.year,b.month-1,b.day,h,m)-8*3600*1000
}
function bookingCountdown(b){
  const diff=bookingMoment(b)-Date.now()
  if(diff<=0)return {text:'已到到店时间',soon:false,done:true}
  const totalMin=Math.floor(diff/60000),d=Math.floor(totalMin/1440),h=Math.floor(totalMin%1440/60),m=totalMin%60
  if(diff<=6*3600*1000){
    const s=Math.floor(diff%60000/1000)
    return {text:`倒计时 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`,soon:true,done:false}
  }
  return {text:d?`还有 ${d} 天 ${h} 小时`:`还有 ${h} 小时 ${m} 分`,soon:false,done:false}
}

let lastRenderedScreen=null
const scrollMemo={}
let pendingScrollRestore=null
function render(){
  if(timerId&&S.screen!=='experience'){clearInterval(timerId);timerId=null}
  if(upcomingTimer){clearInterval(upcomingTimer);upcomingTimer=null}
  const screenChanged=lastRenderedScreen!==S.screen
  if(screenChanged){
    if(lastRenderedScreen)scrollMemo[lastRenderedScreen]=window.scrollY
    lastRenderedScreen=S.screen
  }
  const views={login:viewLogin,onboarding:viewOnboarding,home:viewHome,search:viewSearch,map:viewMap,unlock:viewUnlock,detail:viewDetail,storeInfo:viewStoreInfo,allReviews:viewAllReviews,experience:viewExperience,diary:viewDiary,result:viewResult,journal:viewJournal,summary:viewSummary,avatar:viewAvatar,profile:viewProfile,storeMap:viewStoreMap,bookings:viewBookings,bookingDetail:viewBookingDetail,payment:viewPayment,bookingSuccess:viewBookingSuccess}
  app.innerHTML=(views[S.screen]||viewHome)()+navHtml()+toastHtml()+sheetHtml()+miniHeaderHtml()+locFabHtml()+sectionMiniHtml()+floatingBackHtml()+lightboxHtml()
  if(screenChanged)window.scrollTo(0,pendingScrollRestore!=null?pendingScrollRestore:0)
  pendingScrollRestore=null
  bindDynamic()
  updateMiniHeader()
  updateSectionHead()
  updateStoresSection()
  if(S.screen==='map')setTimeout(renderRealMap,0)
  const soon=S.bookings.filter(b=>b.status==='booked'&&bookingCountdown(b).soon)
  if(soon.length){
    if(!S.upcomingNotified){S.upcomingNotified=true;setTimeout(()=>showToast('有预约将在 6 小时内到店，记得准时登岛'),300)}
    upcomingTimer=setInterval(()=>{
      soon.forEach(b=>{const el=document.getElementById('cd-'+b.id);if(el)el.textContent=bookingCountdown(b).text})
    },1000)
  }
}
function bindDynamic(){
  const carousel=document.getElementById('carousel')
  if(carousel){
    carousel.scrollLeft=S.carouselIndex*266
    let last=S.carouselIndex
    carousel.addEventListener('scroll',()=>{
      const idx=Math.max(0,Math.min(DATA.islands.length-1,Math.round(carousel.scrollLeft/266)))
      if(idx===last)return
      last=idx;S.carouselIndex=idx;S.selectedIslandId=DATA.islands[idx].id
      document.querySelectorAll('.island-card').forEach((el,n)=>el.classList.toggle('sel-island',n===idx))
      document.querySelectorAll('#dots button').forEach((el,n)=>el.classList.toggle('on',n===idx))
    })
  }
  const heroGallery=document.getElementById('heroGallery')
  if(heroGallery){
    let last=0
    heroGallery.addEventListener('scroll',()=>{
      const w=heroGallery.clientWidth||1
      const idx=Math.max(0,Math.min(heroGallery.children.length-1,Math.round(heroGallery.scrollLeft/w)))
      if(idx===last)return
      last=idx
      document.querySelectorAll('#heroGalleryDots button').forEach((el,n)=>el.classList.toggle('on',n===idx))
    },{passive:true})
  }
  if(S.screen==='experience'&&!timerId){
    timerId=setInterval(()=>{if(S.elapsed>0)S.elapsed--;const el=document.getElementById('timer');if(el)el.textContent=fmtTime(S.elapsed)},1000)
  }
  if(S.screen==='map')applyMapFilter()
}
function applyMapFilter(){
  const q=S.mapQuery.trim()
  let visible=0
  document.querySelectorAll('.photo-pin').forEach(el=>{
    const st=findStore(el.dataset.store), is=findIsland(el.dataset.island)

  })

function submitDiary(){
  const outcome=deriveOutcome(S.diary)
  const i=findIsland(S.selectedIslandId), lv=findLevel(S.levelId)
  const opts=diaryOptions()
  const firstFun=opts.fun.find(x=>x.id===S.diary.fun[0])
  const firstHard=opts.hard.find(x=>x.id===S.diary.hard[0])
  const funOther=S.diary.funOther.trim(),hardOther=S.diary.hardOther.trim()
  const memo=S.diary.discovery.trim()||(funOther?`最有意思的是${funOther}。`:'')||(firstFun?`最有意思的是${firstFun[1]}。`:'')||(hardOther?`${hardOther}的过程比想象中难。`:'')||(firstHard?`${firstHard[1]}的过程比想象中难。`:'')||'看过一座岛，留下一句还没想清楚的话。'
  const now=new Date()
  const labelOrOther=(id,other)=>id==='f_other'||id==='h_other'?(other||'其他'):labelOf(id)
  const summary={
    fun:S.diary.fun.map(id=>labelOrOther(id,funOther)),
    hard:S.diary.hard.map(id=>labelOrOther(id,hardOther)),
    excitement:S.diary.excitement,
    feelings:S.diary.feelings.filter(f=>f.on).map(f=>f.label),
    discovery:S.diary.discovery.trim()
  }
  const entry={id:'r_'+now.getTime(),date:`${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`,islandId:i.id,islandName:i.name,glyph:i.glyph,level:lv.name,status:outcome==='stay'?'revisit':'excluded',memo,rating:S.diary.rating,summary}
  S.flowEntryId=entry.id;S.outcome=outcome;S.preview=null;S.records=[entry,...S.records]
  const d=S.diary, delta={talk:0,make:0,feedback:0,repeat:0}
  if(d.fun.includes('f_talk')||d.feelings.some(f=>f.id==='like_talk'&&f.on))delta.talk+=8
  if(d.hard.includes('h_talk'))delta.talk-=7
  if(d.fun.includes('f_make')||d.fun.includes('f_finish')||d.feelings.some(f=>f.id==='like_make'&&f.on))delta.make+=8
  if(d.fun.includes('f_space'))delta.make+=4
  if(d.fun.includes('f_shoot')||d.fun.includes('f_edit'))delta.feedback+=6
  if(d.fun.includes('f_finish'))delta.feedback+=5
  if(d.hard.includes('h_repeat')||d.feelings.some(f=>f.id==='tired_repeat'&&f.on))delta.repeat-=9
  if(d.hard.includes('h_detail')||d.hard.includes('h_solo'))delta.repeat-=4
  if(outcome==='stay')delta.feedback+=3
  S.preferences=S.preferences.map(p=>({...p,score:Math.max(12,Math.min(96,p.score+(delta[p.id]||0)))}))
  if(d.rating){
    const aff=S.careerAffinity[i.id]||{total:0,count:0}
    S.careerAffinity[i.id]={total:aff.total+d.rating,count:aff.count+1}
  }
  if(d.fun.includes('f_edit')&&d.hard.includes('h_shoot'))S.insight='你并不排斥影像这个方向，只是更在意画面形成的过程：拍摄让你消耗，后期修图让你投入。下一次可以离镜头远一点，试试灯光布景或图片编辑。'
  else if(outcome==='stay')S.insight=`你在「${i.name}」上给出了正向信号。喜欢不是立刻定下方向的理由，只是多了一条线索：你偏好有明确产出、能看见结果的过程。下一次换一座相似的岛试试。`
  else S.insight=`「${i.name}」这座岛，你登过了，也决定不留下。排除不是失败——它让你知道，比起重复和独自精细处理，你更在意交流、动手和看得见的反馈。下一次可以挑一座节奏不同的岛。`
  if(d.rating>=4)S.insight+=` 你还给「${i.name}」打了 ${d.rating} 分，这类职业目前在你的偏好里排得比较靠前。`
  else if(d.rating&&d.rating<=2)S.insight+=` 你只给「${i.name}」打了 ${d.rating} 分，这类职业暂时可以往后放一放。`
  const doneBooking=S.bookings.find(x=>x.id===S.activeBookingId)
  if(doneBooking)doneBooking.status='completed'
  showToast('体验日记已收进跳岛日志')
  navigate('result')
}
function beginExperience(){
  const b=S.bookings.find(x=>x.id===S.activeBookingId)
  if(!b)return
  S.selectedIslandId=b.islandId;S.levelId=b.levelId;S.activeBookingId=b.id
  S.tasksDone=['t1'];S.mood=null;S.elapsed=durationSeconds(b.levelId)
  S.diary={fun:[],hard:[],excitement:5,feelings:DATA.diary.feelings.map(x=>({...x})),discovery:'',funOther:'',hardOther:'',rating:0}
  navigate('experience')
}

app.addEventListener('click',e=>{
  if(mapMoved){mapMoved=false;return}
  const el=e.target.closest('[data-action]')
  if(!el)return
  const a=el.dataset.action
  switch(a){
    case 'login-submit':case 'login-guest':{
      S.loggedIn=true
      if(a==='login-guest')showToast('已进入本地游客模式')
      S.stack=[];S.screen='onboarding';render()
      break
    }
    case 'onboard-next':S.step=2;render();break
    case 'onboard-finish':finishOnboarding();break
    case 'onboard-skip':finishOnboarding({interests:DATA.user.interests.slice(),nickname:DATA.user.nickname});break
    case 'interest':{
      const id=el.dataset.id
      if(!S.interests.includes(id)&&S.interests.length>=3){showToast('最多选 3 个，先取消一个再换');break}
      S.interests=S.interests.includes(id)?S.interests.filter(x=>x!==id):[...S.interests,id]
      el.classList.toggle('on',S.interests.includes(id))
      const c=document.getElementById('interestCount');if(c)c.textContent=`已选 ${S.interests.length}/3 个 · 选满 3 个，之后都可以改`
      break
    }
    case 'nav':{
      S.stack=[]
      if(el.dataset.id==='map'){S.mapHeadCollapsed=false;S.storesHidden=false;S.mapFullscreen=false}
      S.screen=el.dataset.id;render();break
    }
    case 'nav-map':S.stack=[];S.mapHeadCollapsed=false;S.storesHidden=false;S.mapFullscreen=false;S.screen='map';render();break
    case 'header-expand':window.scrollTo({top:0,behavior:'smooth'});break
    case 'open-search':navigate('search');break
    case 'header-location':window.scrollTo({top:0,behavior:'smooth'});S.sheet='location';render();break
    case 'search-chip':{S.searchQuery=el.dataset.value;const input=document.getElementById('pageSearch');if(input)input.value=S.searchQuery;applyPageSearch();break}
    case 'clear-page-search':{S.searchQuery='';const input=document.getElementById('pageSearch');if(input){input.value='';input.focus()}applyPageSearch();break}
    case 'plus':navigate('avatar');break
    case 'avatar-look':S.avatarLook=el.dataset.look;render();break
    case 'open-image':S.lightboxSrc=el.dataset.src;render();break
    case 'close-image':S.lightboxSrc=null;render();break
    case 'store-map':S.mapTargetStore=S.storeId;navigate('storeMap');break
    case 'mentor-detail':S.activeMentor={storeId:el.dataset.store,idx:Number(el.dataset.idx)};S.mentorPickMode=false;S.sheet='mentor';render();break
    case 'mentor-select':S.activeMentor={storeId:el.dataset.store,idx:Number(el.dataset.idx)};S.mentorPickMode=true;S.sheet='mentor';render();break
    case 'choose-mentor':S.selectedMentor={...S.activeMentor};S.sheet=null;render();showToast('已选择带教人');break
    case 'close-sheet':S.sheet=null;render();break
    case 'location':case 'locate':S.sheet='location';render();break
    case 'map-reset':S.autoLocation=true;S.mapPan={x:0,y:0};S.mapZoom=1;S.mapCenter={...S.geo};applyMapTransform();break
    case 'map-zoom-in':if(S.mapZoom<1.8){S.mapZoom=Math.min(1.8,S.mapZoom+0.15);applyMapTransform()}break
    case 'map-zoom-out':if(S.mapZoom>0.8){S.mapZoom=Math.max(0.8,S.mapZoom-0.15);applyMapTransform()}break
    case 'expand-section':S.mapHeadCollapsed=false;updateSectionHead();window.scrollTo({top:0,behavior:'smooth'});break
    case 'use-geolocation':{
      S.autoLocation=true;S.mapCenter={...S.geo};S.mapPan={x:0,y:0};S.sheet=null;render()
      break
    }
    case 'choose-location':S.autoLocation=false;S.location=coarseLocation(el.dataset.value);S.geo=coordsForLocation(S.location);S.mapCenter={...S.geo};S.mapPan={x:0,y:0};S.sheet=null;render();showToast('定位已更新 · '+S.location);break
    case 'custom-location':{
      const v=(document.getElementById('customLocation')||{}).value?.trim()
      if(v){S.autoLocation=false;S.location=coarseLocation(v);S.sheet=null;render();showToast('定位已更新 · '+S.location)}
      break
    }
    case 'sheet-home':S.sheet=null;S.stack=[];S.screen='home';render();break
    case 'sheet-bookings':S.sheet=null;navigate('bookings');break
    case 'sheet-unlock':S.sheet=null;S.stack=[];S.screen='unlock';render();break
    case 'sheet-journal':S.sheet=null;S.stack=[];S.screen='journal';render();break
    case 'nav-bookings':navigate('bookings');break
    case 'nav-journal':navigate('journal');break
    case 'edit-profile':S.editDraft={nickname:S.profile.nickname,signature:S.profile.signature||''};S.sheet='edit-profile';render();break
    case 'save-profile':{
      const n=S.editDraft.nickname.trim(),sg=S.editDraft.signature.trim()
      if(!n){showToast('请填写用户名');break}
      S.profile.nickname=n;S.nickname=n;S.profile.signature=sg;S.sheet=null;render();showToast('个人资料已更新');break
    }
    case 'avatar-picker':S.sheet='avatar-picker';render();break
    case 'choose-avatar':{
      const idx=Number(el.dataset.idx)
      S.profile.avatar=idx<0?null:idx;S.sheet=null;render();showToast('头像已更新');break
    }
    case 'account-info':if(!S.loggedIn){showToast('请先登录');break}S.sheet='account-info';render();break
    case 'switch-account':if(!S.loggedIn){showToast('请先登录');break}S.sheet='switch-account';render();break
    case 'choose-account':S.profile.nickname=el.dataset.value;S.nickname=el.dataset.value;S.sheet=null;render();showToast('已切换为 '+el.dataset.value);break
    case 'logout':S.loggedIn=false;render();showToast('已退出登录');break
    case 'login':S.loggedIn=true;render();showToast('已登录 · 演示账号');break
    case 'island-piece':showToast('先去体验「'+el.dataset.name+'」，回来点亮这块碎片');break
    case 'unlock-island':{
      const id=el.dataset.id
      const rec=S.records.find(r=>r.islandId===id)
      if(rec){S.activeSummaryId=rec.id;S.selectedIslandId=id;navigate('summary')}
      else showToast('这座岛还没登过，先去预约试试')
      break
    }
    case 'pick-island':{
      S.selectedIslandId=el.dataset.id
      S.carouselIndex=S.homeList.findIndex(x=>x.id===S.selectedIslandId)
      document.querySelectorAll('.island-card').forEach(x=>x.classList.toggle('sel-island',x===el))
      document.querySelectorAll('#dots button').forEach((x,n)=>x.classList.toggle('on',n===S.carouselIndex))
      break
    }
    case 'dot':{
      const idx=Number(el.dataset.index), track=document.getElementById('carousel'), id=S.homeList[idx]
      if(!id)break
      if(track)track.scrollTo({left:idx*266,behavior:'smooth'})
      S.carouselIndex=idx;S.selectedIslandId=id
      document.querySelectorAll('#dots button').forEach((x,n)=>x.classList.toggle('on',n===idx))
      document.querySelectorAll('.island-card').forEach((x,n)=>x.classList.toggle('sel-island',n===idx))
      break
    }
    case 'hero-gallery-dot':{
      const idx=Number(el.dataset.index), track=document.getElementById('heroGallery')
      if(!track)break
      track.scrollTo({left:idx*track.clientWidth,behavior:'smooth'})
      document.querySelectorAll('#heroGalleryDots button').forEach((x,n)=>x.classList.toggle('on',n===idx))
      break
    }
    case 'open-detail':navigate('detail');break
    case 'open-detail-id':S.selectedIslandId=el.dataset.id;S.storeId=null;navigate('detail');break
    case 'open-detail-store':S.selectedIslandId=el.dataset.island;S.storeId=el.dataset.store;navigate('detail');break
    case 'open-store-info':{
      const fallback=DATA.stores.find(x=>x.islandId===S.selectedIslandId)||DATA.stores[0]
      const current=findStore(S.storeId)
      S.storeId=current&&current.islandId===S.selectedIslandId?current.id:fallback.id
      S.reviewsExpanded=false
      navigate('storeInfo')

      break
    }
    case 'open-reviews':S.reviewTab='all';S.reviewLimit=6;navigate('allReviews');break
    case 'review-tab':S.reviewTab=el.dataset.id;S.reviewLimit=6;updateReviewList();break
    case 'review-more':loadMoreReviews();break
    case 'review-toast':showToast(el.dataset.msg||'敬请期待');break
    case 'review-like':{
      const id=el.dataset.id, r=DATA.reviews.find(x=>x.id===id)
      if(!r)break
      const liked=S.likedReviews.includes(id)
      S.likedReviews=liked?S.likedReviews.filter(x=>x!==id):[...S.likedReviews,id]
      el.classList.toggle('on',!liked)
      el.innerHTML=(liked?'♡':'♥')+` 点赞 ${r.likes+(liked?0:1)}`
      break
    }
    case 'continue':navigate('bookings');break
    case 'show-stores':{
      S.storesHidden=false;S.mapFullscreen=false;updateStoresSection()
      const section=document.getElementById('storesSection');if(section)section.scrollIntoView({behavior:'smooth',block:'start'})
      break
    }
    case 'store':{
      S.activeStore=el.dataset.store;S.storeId=el.dataset.store;S.storesHidden=false;S.mapFullscreen=false;render()
      const card=document.querySelector('.store-card[data-store="'+S.activeStore+'"]'),track=document.getElementById('storeTrack')
      if(card&&track)track.scrollTo({left:card.offsetLeft-track.offsetLeft-24,behavior:'smooth'})
      const section=document.getElementById('storesSection');if(section)section.scrollIntoView({behavior:'smooth',block:'start'})
      break
    }
    case 'back':goBack();break
    case 'filter':S.filter=el.dataset.id;render();break
    case 'custom':{
      const t=el.dataset.id
      S.custom=S.custom.includes(t)?S.custom.filter(x=>x!==t):[...S.custom,t];render();break
    }
    case 'level':S.levelId=el.dataset.id;render();break
    case 'toggle-reviews':{
      S.reviewsExpanded=!S.reviewsExpanded;render()
      const node=document.getElementById('storeReviews');if(node)node.scrollIntoView({behavior:'smooth',block:'start'})
      break
    }
    case 'scroll-detail':{
      const node=document.getElementById(el.dataset.target)
      if(node)node.scrollIntoView({behavior:'smooth',block:'start'})
      document.querySelectorAll('[data-action="scroll-detail"]').forEach(x=>{
        x.classList.toggle('dark',x===el);x.classList.toggle('default',x!==el)
      })
      break
    }
    case 'scroll-levels':document.getElementById('levels').scrollIntoView({behavior:'smooth',block:'center'});break
    case 'date-month':{
      const m=S.bookingDate.month+Number(el.dataset.delta)
      if(m<1||m>12)break
      S.bookingDate.month=m
      const total=new Date(S.bookingDate.year,m,0).getDate()
      if(S.bookingDate.day>total)S.bookingDate.day=total
      render();break
    }
    case 'date-day':S.bookingDate.day=Number(el.dataset.day);render();break
    case 'book':{
      const i=findIsland(S.selectedIslandId),lv=findLevel(S.levelId),bd=S.bookingDate
      const bstore=findStore(S.storeId)||DATA.stores.find(x=>x.islandId===i.id)||DATA.stores[0]
      if(!S.selectedMentor||S.selectedMentor.storeId!==bstore.id){
        S.sheet='mentor-required';render();break
      }
      const record={id:'b_'+Date.now(),islandId:i.id,levelId:lv.id,storeId:S.storeId,mentorIdx:S.selectedMentor.idx,year:bd.year,month:bd.month,day:bd.day,status:'booked'}
      S.bookings.unshift(record);S.booking=record;S.activeBookingId=record.id
      navigate('payment');break
    }
    case 'goto-mentor':S.sheet=null;render();setTimeout(()=>{const el=document.getElementById('mentorInfo');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},80);break
    case 'choose-pay':S.payMethod=el.dataset.method;render();break
    case 'pay-now':showToast('支付成功');navigate('bookingSuccess');break
    case 'cancel-payment':navigate('bookingDetail');break
    case 'booking-detail':S.activeBookingId=el.dataset.id;navigate('bookingDetail');break
    case 'start-experience':beginExperience();break
    case 'reminder-start':S.activeBookingId=el.dataset.id;beginExperience();break
    case 'cancel-booking':{
      S.bookings=S.bookings.filter(x=>x.id!==S.activeBookingId)
      S.activeBookingId=null;S.booking=S.bookings[0]||null
      showToast('已取消预约');navigate('bookings');break
    }
    case 'task':{
      const id=el.dataset.id
      S.tasksDone=S.tasksDone.includes(id)?S.tasksDone.filter(x=>x!==id):[...S.tasksDone,id];render();break
    }
    case 'mood':S.mood=el.dataset.id;render();break
    case 'finish-experience':navigate('diary');break
    case 'diary-chip':{
      const g=el.dataset.group,id=el.dataset.id
      S.diary[g]=S.diary[g].includes(id)?S.diary[g].filter(x=>x!==id):[...S.diary[g],id]
      render();break
    }
    case 'rating':S.diary.rating=Number(el.dataset.score);render();break
    case 'feeling':{
      const f=S.diary.feelings.find(x=>x.id===el.dataset.id);f.on=!f.on
      el.querySelector('.sw').classList.toggle('on',f.on);break
    }
    case 'diary-submit':submitDiary();break
    case 'result-preview':S.preview=S.preview?null:(S.outcome==='leave'?'stay':'leave');render();break
    case 'result-journal':navigate('journal');break
    case 'result-home':S.stack=[];S.screen='home';render();break
    case 'back-home':S.stack=[];S.screen='home';render();break
    case 'open-summary':S.activeSummaryId=el.dataset.id;navigate('summary');break
    case 'journal-open':S.selectedIslandId=(S.records[0]&&S.records[0].islandId)||'photo';S.storeId=null;navigate('detail');break
    case 'journal-home':S.stack=[];S.screen='home';render();break
  }
})

let lastReviewAutoLoad=0
window.addEventListener('scroll',()=>{
  if(S.screen!=='allReviews')return
  const btn=document.getElementById('reviewMore'), box=document.getElementById('reviewList')
  if(!btn||!box||btn.classList.contains('hidden'))return
  if(box.getBoundingClientRect().bottom<window.innerHeight+240&&Date.now()-lastReviewAutoLoad>450){
    lastReviewAutoLoad=Date.now()
    loadMoreReviews()
  }
},{passive:true})

app.addEventListener('input',e=>{
  const f=e.target.dataset.field
  if(f==='nickname')S.nickname=e.target.value
  if(f==='profileNickname')S.editDraft.nickname=e.target.value
  if(f==='profileSignature')S.editDraft.signature=e.target.value
  if(f==='pageSearch'){S.searchQuery=e.target.value;applyPageSearch()}
  if(f==='bookingMonth'){
    S.bookingDate.month=Number(e.target.value)
    const total=new Date(S.bookingDate.year,S.bookingDate.month,0).getDate()
    if(S.bookingDate.day>total)S.bookingDate.day=total
    render()
  }
  if(f==='mapQuery'){S.mapQuery=e.target.value;applyMapFilter()}
  if(f==='excitement'){
    S.diary.excitement=Number(e.target.value)
    e.target.style.setProperty('--p',((S.diary.excitement-1)/9*100)+'%')
    const v=document.getElementById('exciteVal'),l=document.getElementById('exciteLabel')
    if(v)v.textContent=S.diary.excitement
    if(l)l.textContent=['几乎没什么感觉','有一点点好奇','还算平静','有一点投入','比较投入','挺兴奋的','很兴奋','非常兴奋','几乎不想停','完全沉浸'][S.diary.excitement-1]
  }
  if(f==='discovery'){S.diary.discovery=e.target.value;const c=document.getElementById('discCount');if(c)c.textContent=e.target.value.length}
  if(f==='funOther')S.diary.funOther=e.target.value
  if(f==='hardOther')S.diary.hardOther=e.target.value
})
app.addEventListener('change',e=>{if(e.target.dataset.field==='bookingMonth')e.target.dispatchEvent(new Event('input',{bubbles:true}))})

app.addEventListener('pointerdown',e=>{
  if(!['map','storeMap'].includes(S.screen)||!e.target.closest('.map-dark'))return
  if(e.pointerType==='mouse'&&e.button!==0)return
  if(S.screen==='map'){
    S.mapHeadCollapsed=true;S.storesHidden=true;S.mapFullscreen=true
    updateSectionHead();updateStoresSection()
  }
  if(e.target.closest('.map-ctrl'))return
  if(S.screen==='storeMap'&&!S.storeMapPan)S.storeMapPan={x:0,y:0}
  const pan=S.screen==='storeMap'?S.storeMapPan:S.mapPan
  mapDrag={id:e.pointerId,x:e.clientX,y:e.clientY,ox:pan.x,oy:pan.y,screen:S.screen}
})
app.addEventListener('pointermove',e=>{
  if(!mapDrag||mapDrag.id!==e.pointerId)return
  const dx=e.clientX-mapDrag.x,dy=e.clientY-mapDrag.y
  if(Math.abs(dx)+Math.abs(dy)>4)mapMoved=true
  const pan=mapDrag.screen==='storeMap'?S.storeMapPan:S.mapPan
  pan.x=mapDrag.ox+dx
  pan.y=mapDrag.oy+dy
  if(mapDrag.screen==='storeMap'){
    const canvas=document.getElementById('mapCanvas')
    if(canvas)canvas.style.transform=`translate(${pan.x}px,${pan.y}px)`
  }else applyMapTransform()
})
app.addEventListener('pointerup',()=>{
  if(mapMoved)setTimeout(()=>{mapMoved=false},60)
  mapDrag=null
})
app.addEventListener('pointercancel',()=>{mapDrag=null})
app.addEventListener('wheel',e=>{
  if(!e.target.closest('.map-dark'))return
  e.preventDefault()
  const next=Math.max(0.8,Math.min(1.8,S.mapZoom+(e.deltaY<0?0.15:-0.15)))
  if(next!==S.mapZoom){S.mapZoom=next;applyMapTransform()}
},{passive:false})

window.addEventListener('scroll',()=>{
  updateMiniHeader();updateSectionHead()
},{passive:true})
render()
startAutoLocation()
</script>
</body>
</html>
